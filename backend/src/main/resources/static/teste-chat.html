<!DOCTYPE html>
<html>
<head>
    <title>Teste Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        h2 {
            color: #333;
        }

        input {
            padding: 8px;
            margin: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 16px;
            margin: 4px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #messages {
            list-style: none;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        #messages li {
            padding: 6px;
            border-bottom: 1px solid #eee;
        }

        #statusConexao {
            font-weight: bold;
            margin-left: 10px;
        }

        .section {
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        label {
            font-size: 12px;
            color: #666;
            display: block;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <h2>Teste Chat WebSocket 🔐</h2>

    <div class="section">
        <h3>Conexão</h3>
        <label>Username</label>
        <input id="username" placeholder="Username" />

        <label>Senha</label>
        <input id="password" type="password" placeholder="Senha" />

        <label>Meu ID</label>
        <input id="meuId" placeholder="Meu ID" />

        <label>ID do destinatário</label>
        <input id="destinatarioId" placeholder="ID do destinatário" />

        <br/>
        <button onclick="conectar()">Conectar</button>
        <span id="statusConexao" style="color: gray;">● desconectado</span>
    </div>

    <div class="section">
        <h3>Mensagem</h3>
        <input id="content" placeholder="Digite sua mensagem..." style="width: 70%;" />
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <div class="section">
        <h3>Mensagens e Presença</h3>
        <ul id="messages"></ul>
    </div>

    <script>
        let stompClient = null;

        async function conectar() {
            const meuId = document.getElementById('meuId').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!meuId || !username || !password) {
                alert('Preencha username, senha e seu ID!');
                return;
            }

            // faz login e pega o token
            const loginResp = await fetch('http://localhost:8080/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const loginData = await loginResp.json();

            if (!loginData.token) {
                alert('Login falhou: ' + loginData.error);
                return;
            }

            const token = loginData.token;
            console.log('Token obtido:', token);

            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);

            // passa o token no header do WebSocket
            const headers = {
                Authorization: 'Bearer ' + token,
                userId: meuId
            };

            stompClient.connect(headers, function () {
                console.log('Conectado e autenticado!');

                // atualiza status visual
                document.getElementById('statusConexao').textContent = '● conectado';
                document.getElementById('statusConexao').style.color = 'green';

                // avisa o servidor que está online
                stompClient.send('/app/presence', {}, JSON.stringify({
                    userId: meuId,
                    online: 'true'
                }));

                // inscreve nas mensagens
                stompClient.subscribe('/topic/messages/' + meuId, function (msg) {
                    const body = JSON.parse(msg.body);
                    const li = document.createElement('li');
                    li.textContent = body.senderUsername + ': ' + body.content;
                    document.getElementById('messages').appendChild(li);
                });

                // inscreve no canal de presença
                stompClient.subscribe('/topic/presence', function (msg) {
                    const body = JSON.parse(msg.body);
                    const status = body.online === 'true' ? 'online 🟢' : 'offline 🔴';
                    const li = document.createElement('li');
                    li.textContent = body.username + ' está ' + status;
                    document.getElementById('messages').appendChild(li);
                });

            }, function (error) {
                console.error('Erro na conexão:', error);
                alert('Erro ao conectar: ' + error);
                document.getElementById('statusConexao').textContent = '● desconectado';
                document.getElementById('statusConexao').style.color = 'gray';
            });
        }

        function sendMessage() {
            if (!stompClient) {
                alert('Conecte primeiro!');
                return;
            }

            const content = document.getElementById('content').value;

            if (!content.trim()) {
                alert('Digite uma mensagem!');
                return;
            }

            const payload = {
                senderId: document.getElementById('meuId').value,
                receiverId: document.getElementById('destinatarioId').value,
                content: content
            };

            stompClient.send('/app/chat', {}, JSON.stringify(payload));

            // exibe a mensagem enviada na própria tela
            const li = document.createElement('li');
            li.textContent = 'Você: ' + content;
            li.style.color = '#4CAF50';
            document.getElementById('messages').appendChild(li);

            // limpa o campo após enviar
            document.getElementById('content').value = '';
        }

        // envia mensagem com Enter
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('content').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
