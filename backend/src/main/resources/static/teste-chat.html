<!DOCTYPE html>
<html>
<head>
    <title>Teste Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        h2 {
            color: #333;
        }

        input {
            padding: 8px;
            margin: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 16px;
            margin: 4px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        #messages {
            list-style: none;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        #messages li {
            padding: 6px;
            border-bottom: 1px solid #eee;
        }

        #statusConexao {
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h2>Teste Chat WebSocket</h2>

    <div>
        <input id="meuId" placeholder="Meu ID" />
        <input id="destinatarioId" placeholder="ID do destinatário" />
        <button onclick="conectar()">Conectar</button>
        <span id="statusConexao" style="color: gray;">● desconectado</span>
    </div>

    <br/>

    <div>
        <input id="content" placeholder="Digite sua mensagem..." style="width: 70%;" />
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <div>
        <h3>Mensagens e Presença:</h3>
        <ul id="messages"></ul>
    </div>

    <script>
        let stompClient = null;

        function conectar() {
            const myId = document.getElementById('meuId').value;

            if (!myId) {
                alert('Digite seu ID antes de conectar!');
                return;
            }

            const socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);

            const headers = { userId: myId };

            stompClient.connect(headers, function () {
                console.log('Conectado no canal /topic/messages/' + myId);

                // atualiza status visual
                document.getElementById('statusConexao').textContent = '● conectado';
                document.getElementById('statusConexao').style.color = 'green';

                // avisa o servidor que está online
                stompClient.send('/app/presence', {}, JSON.stringify({
                    userId: myId,
                    online: 'true'
                }));

                // inscreve nas mensagens
                stompClient.subscribe('/topic/messages/' + myId, function (msg) {
                    const body = JSON.parse(msg.body);
                    const li = document.createElement('li');
                    li.textContent = body.senderUsername + ': ' + body.content;
                    document.getElementById('messages').appendChild(li);
                });

                // inscreve no canal de presença
                stompClient.subscribe('/topic/presence', function (msg) {
                    const body = JSON.parse(msg.body);
                    const status = body.online === 'true' ? 'online 🟢' : 'offline 🔴';
                    const li = document.createElement('li');
                    li.textContent = body.username + ' está ' + status;
                    document.getElementById('messages').appendChild(li);
                });
            });
        }

        function sendMessage() {
            if (!stompClient) {
                alert('Conecte primeiro!');
                return;
            }

            const content = document.getElementById('content').value;

            if (!content.trim()) {
                alert('Digite uma mensagem!');
                return;
            }

            const payload = {
                senderId: document.getElementById('meuId').value,
                receiverId: document.getElementById('destinatarioId').value,
                content: content
            };

            stompClient.send('/app/chat', {}, JSON.stringify(payload));

            // limpa o campo após enviar
            document.getElementById('content').value = '';
        }

        // envia mensagem com Enter
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('content').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
